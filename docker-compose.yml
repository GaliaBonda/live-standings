services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: standings
      POSTGRES_PASSWORD: standings
      POSTGRES_DB: standings
    ports:
      - "5434:5432"
    volumes:
      - standings_pg:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"

volumes:
  standings_pg:
